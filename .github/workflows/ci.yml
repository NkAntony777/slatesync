name: Core tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: LTC and Poly regression tests
        run: node --test test/ltc-low-level.test.mjs test/poly-compatibility.test.mjs
      - name: Synthetic integration checks
        run: node test/run-tests.mjs
