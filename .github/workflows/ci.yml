name: Core tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      run_bench:
        description: 'Run the long LTC benchmark (slow, minutes)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: LTC and Poly regression tests
        run: node --test test/ltc-low-level.test.mjs test/poly-compatibility.test.mjs test/ltc-parity.test.mjs test/ltc-performance.test.mjs test/ltc-drift.test.mjs test/take-fps.test.mjs test/take-health.test.mjs test/acceptance-checklist.test.mjs test/write-backup.test.mjs test/export-options.test.mjs test/take-health-ui.test.mjs
      - name: Synthetic integration checks
        run: node test/run-tests.mjs

  bench:
    if: github.event_name == 'workflow_dispatch' && inputs.run_bench
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: LTC benchmark (manual, slow)
        run: node test/bench-ltc.mjs
